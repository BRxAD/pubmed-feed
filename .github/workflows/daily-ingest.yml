name: Daily PubMed ingest

on:
  schedule:
    # 06:00 Eastern (EDT = UTC-4) → 10:00 UTC
    - cron: "0 10 * * *"
    # 17:00 Eastern (EDT = UTC-4) → 21:00 UTC
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Cron now returns non-2xx when ingest fails; also require JSON ok:true.
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 320 \
            "https://pubmedfeed.vercel.app/api/cron/daily-digest")"
          echo "HTTP $code"
          cat "$body"
          echo
          if [ "$code" != "200" ]; then
            exit 1
          fi
          if ! grep -q '"ok":true' "$body"; then
            echo "daily-digest JSON ok is not true"
            exit 1
          fi
